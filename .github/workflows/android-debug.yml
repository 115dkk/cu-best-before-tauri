name: Android debug APK

# Manual: build an unsigned debug APK for a chosen ABI and upload it as an
# artifact. Used for emulator (x86_64) testing when the local Windows build
# cannot finish (Gradle transform moves / symlinks need Developer Mode).
on:
  # TEMP: build on pushes to the feature branch until this workflow reaches main.
  push:
    branches: [feat/initial-app]
  workflow_dispatch:
    inputs:
      arch:
        description: Rust target (x86_64 for the emulator, aarch64 for devices)
        type: choice
        default: x86_64
        options: [x86_64, aarch64]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 28.2.13676358
  ANDROID_PLATFORM: android-36
  BUILD_TOOLS: 36.0.0

jobs:
  build:
    name: debug APK (${{ inputs.arch || 'x86_64' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.NDK_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.arch || 'x86_64' }}-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-debug-${{ inputs.arch || 'x86_64' }}

      - run: npm ci

      - name: Build debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          chmod +x src-tauri/gen/android/gradlew
          npx tauri android build --debug --apk --target ${{ inputs.arch || 'x86_64' }}
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print

      - uses: actions/upload-artifact@v7
        with:
          name: cu-best-before-debug-${{ inputs.arch || 'x86_64' }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 7
